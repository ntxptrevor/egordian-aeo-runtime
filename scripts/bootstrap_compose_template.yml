# eGordian AEO MCP service - Hostinger deployment with STOCK IMAGES ONLY.
#
# GENERATED FILE - do not edit docker-compose.hostinger-bootstrap.yml by hand.
#   source:   scripts/bootstrap_compose_template.yml + scripts/bootstrap_runtime.py
#   regen:    python3 scripts/render_bootstrap_compose.py
#   verify:   python3 scripts/render_bootstrap_compose.py --check
#
# Why this file exists: Hostinger's create-project runner stores a compose file
# but does not build a remote git `build.context`, so it reported success with
# zero containers. This variant therefore uses **no custom image, no build step
# and no private registry** - only `python:3.12-slim` straight from Docker Hub.
#
# Two services:
#   A) egordian-bootstrap  one-shot. Downloads the approved public repo archive
#      for a pinned ref, extracts it with full path-traversal/link checks,
#      verifies the encrypted catalogue parts (per-part SHA-256, contiguous
#      indices, overall SHA-256, EGCAT1 magic), pip-installs dependencies into a
#      persistent private runtime volume, stages code + decryptor + ciphertext
#      owned by uid 10001, writes an idempotency stamp, exits 0. It receives no
#      secrets of any kind.
#   B) egordian-mcp        waits for the bootstrap to complete successfully,
#      then runs as uid 10001 with a read-only root filesystem, all capabilities
#      dropped, the runtime volume mounted read-only, the overlay volume rw, and
#      the catalogue decrypted into a uid-owned tmpfs. Secrets come from the env
#      file at runtime only.
#
# Deploy:
#   docker compose -f docker-compose.hostinger-bootstrap.yml --env-file ./egordian.env up -d
#   docker compose -f docker-compose.hostinger-bootstrap.yml --env-file ./egordian.env logs -f egordian-bootstrap
#
# Re-run the bootstrap after publishing a new revision:
#   RUNTIME_REF=<new-sha> FORCE_BOOTSTRAP=1 docker compose -f docker-compose.hostinger-bootstrap.yml \
#     --env-file ./egordian.env up -d --force-recreate

x-stock-image: &stock-image "python:3.12-slim"

services:
  # ---------------------------------------------------------------------
  # A) one-shot bootstrap - no secrets, no ingress, no ports
  # ---------------------------------------------------------------------
  egordian-bootstrap:
    image: *stock-image
    container_name: egordian-bootstrap
    restart: "no"
    # Root is required only to chown the staged tree to uid 10001 on a fresh
    # volume; the container has no ports, no secrets and exits immediately.
    user: "0:0"
    working_dir: /runtime
    environment:
      RUNTIME_REPO: ${RUNTIME_REPO:-ntxptrevor/egordian-aeo-runtime}
      # Pin a commit SHA. `main` is accepted but logs a reproducibility warning.
      RUNTIME_REF: ${RUNTIME_REF:-8659f42}
      RUNTIME_ROOT: /runtime
      RUNTIME_UID: "10001"
      RUNTIME_GID: "10001"
      # Optional integrity pins (hashes, never secrets).
      ARCHIVE_SHA256: ${ARCHIVE_SHA256:-}
      CATALOGUE_ENC_SHA256: ${CATALOGUE_ENC_SHA256:-}
      FORCE_BOOTSTRAP: ${FORCE_BOOTSTRAP:-0}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    entrypoint: ["python3", "-c"]
    command:
      - |
        # @@BOOTSTRAP_PROGRAM@@
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1024m
    volumes:
      - type: volume
        source: egordian_runtime
        target: /runtime
    networks:
      - n8n_default
    labels:
      traefik.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # B) runtime - stock image, hardened, secrets from env only
  # ---------------------------------------------------------------------
  egordian-mcp:
    image: *stock-image
    container_name: egordian-mcp
    restart: unless-stopped
    depends_on:
      egordian-bootstrap:
        condition: service_completed_successfully

    # No `ports:` on purpose - ingress is Traefik-only.
    expose:
      - "8080"

    user: "10001:10001"
    working_dir: /runtime/app

    environment:
      # --- service ---
      DEPLOYMENT_ENV: production
      AUTH_MODE: bearer
      HOST: 0.0.0.0
      PORT: "8080"
      WEB_CONCURRENCY: "2"
      PUBLIC_BASE_URL: https://egordian.joctools.com
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # --- paths into the bootstrap-prepared runtime volume (no custom image) ---
      CATALOGUE_ENC_PATH: /runtime/catalogue.enc
      CATALOGUE_CRYPTO_PATH: /runtime/bin/catalogue_crypto.py
      APP_ROOT: /runtime/app
      RUNTIME_SITE_PACKAGES: /runtime/site-packages
      CATALOGUE_RUNTIME_DIR: /run/egordian
      CATALOGUE_DB_PATH: /run/egordian/catalogue.sqlite
      OVERLAY_DB_PATH: /var/lib/egordian/data.db

      # --- required secrets / pins (env file only, never a build input) ---
      SERVICE_TOKENS: ${SERVICE_TOKENS:?SERVICE_TOKENS is required}
      CATALOGUE_DECRYPTION_KEY: ${CATALOGUE_DECRYPTION_KEY:?CATALOGUE_DECRYPTION_KEY is required}
      CATALOGUE_SHA256: ${CATALOGUE_SHA256:?CATALOGUE_SHA256 is required}

      # --- optional durable control plane ---
      DATABASE_URL: ${DATABASE_URL:-}

      # --- eGordian upstream credentials: entirely optional ---
      EGORDIAN_BASE_URL: ${EGORDIAN_BASE_URL:-https://jocservice.egordian.com}
      EGORDIAN_AUTH_PROVIDER: ${EGORDIAN_AUTH_PROVIDER:-none}
      EGORDIAN_USERNAME: ${EGORDIAN_USERNAME:-}
      EGORDIAN_PASSWORD: ${EGORDIAN_PASSWORD:-}
      EGORDIAN_BEARER_TOKEN: ${EGORDIAN_BEARER_TOKEN:-}
      EGORDIAN_HEADER_MAP: ${EGORDIAN_HEADER_MAP:-}

      # --- capability switches stay off unless explicitly enabled ---
      ALLOW_EGORDIAN_WRITES: ${ALLOW_EGORDIAN_WRITES:-false}
      ALLOW_ADMIN_OPERATIONS: ${ALLOW_ADMIN_OPERATIONS:-false}
      ALLOW_LEGACY_2025_CLIENTS: ${ALLOW_LEGACY_2025_CLIENTS:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}

    entrypoint: ["/runtime/bin/registry-entrypoint.sh"]

    # --- hardening -----------------------------------------------------------
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
      # The decrypted catalogue lives here and nowhere else: memory-only,
      # uid-owned, never on host disk, gone when the container stops.
      - /run/egordian:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      # Prepared by the bootstrap service; the runtime can only read it.
      - type: volume
        source: egordian_runtime
        target: /runtime
        read_only: true
      # Control-plane overlay (data.db, WAL) - the only writable persistent state.
      # No `nocopy`: an empty named volume must be seeded so uid 10001 can write.
      - type: volume
        source: egordian_overlay
        target: /var/lib/egordian

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/healthz').read()
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - n8n_default

    labels:
      traefik.enable: "true"
      traefik.docker.network: "n8n_default"

      traefik.http.routers.egordian.rule: "Host(`egordian.joctools.com`)"
      traefik.http.routers.egordian.entrypoints: "websecure"
      traefik.http.routers.egordian.tls: "true"
      traefik.http.routers.egordian.tls.certresolver: "mytlschallenge"
      traefik.http.routers.egordian.service: "egordian"
      traefik.http.routers.egordian.middlewares: "egordian-secure@docker"

      traefik.http.routers.egordian-http.rule: "Host(`egordian.joctools.com`)"
      traefik.http.routers.egordian-http.entrypoints: "web"
      traefik.http.routers.egordian-http.middlewares: "egordian-redirect@docker"
      traefik.http.routers.egordian-http.service: "egordian"

      traefik.http.middlewares.egordian-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.egordian-redirect.redirectscheme.permanent: "true"

      traefik.http.middlewares.egordian-secure.headers.stsSeconds: "31536000"
      traefik.http.middlewares.egordian-secure.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.egordian-secure.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.egordian-secure.headers.frameDeny: "true"
      traefik.http.middlewares.egordian-secure.headers.referrerPolicy: "no-referrer"
      traefik.http.middlewares.egordian-secure.headers.customresponseheaders.X-Robots-Tag: "noindex, nofollow"

      traefik.http.services.egordian.loadbalancer.server.port: "8080"
      traefik.http.services.egordian.loadbalancer.healthcheck.path: "/healthz"
      traefik.http.services.egordian.loadbalancer.healthcheck.interval: "30s"

networks:
  n8n_default:
    external: true

volumes:
  # Bootstrap-prepared code, dependencies and sealed ciphertext.
  egordian_runtime:
    name: egordian_runtime
  # Persistent control plane only. The plaintext catalogue is never here.
  egordian_overlay:
    name: egordian_overlay
